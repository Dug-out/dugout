<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 860}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = Object.assign({ when: 'week', who: 'friend', seat: 'cheer', budget: 'b4' }, st.sel || {});
    const defs = [
      ['when', '언제', [['week', '이번 주 아무때나'], ['weekend', '주말만'], ['weeknight', '평일 저녁']]],
      ['who', '누구랑', [['solo', '혼자'], ['friend', '친구랑'], ['mate', '메이트 구해요']]],
      ['seat', '좌석', [['cheer', '응원석'], ['table', '테이블석'], ['quiet', '조용한 자리']]],
      ['budget', '예산 (1인)', [['b2', '2만원 이하'], ['b4', '4만원 이하'], ['any', '상관없음']]]
    ];
    const groups = defs.map((g) => ({
      label: g[1],
      opts: g[2].map((o) => {
        const on = sel[g[0]] === o[0];
        return {
          label: o[1],
          checked: on ? 'true' : 'false',
          bg: on ? '#FFFFFF' : 'rgba(255,255,255,0.06)',
          fg: on ? '#1B2A5C' : '#E1E6F5',
          border: on ? '#FFFFFF' : 'rgba(255,255,255,0.32)',
          weight: on ? 700 : 500,
          pick: () => this.setState({ sel: Object.assign({}, sel, { [g[0]]: o[0] }) })
        };
      })
    }));
    const posts = [
      { day: '10.22', dday: 'D-1', title: '목요일 퇴근 직관 같이 가요!', opp: '두산', seat: '1루 응원석', cur: 2, max: 4 },
      { day: '10.23', dday: 'D-2', title: '금요일 수원 원정 같이 가요', opp: 'KT', seat: '외야석', cur: 4, max: 5 },
      { day: '10.22', dday: 'D-1', title: '치맥하면서 편하게 보실 분', opp: '두산', seat: '테이블석', cur: 1, max: 2 }
    ].map((p) => Object.assign({}, p, { left: (p.max - p.cur) + '자리 남음' }));
    return { groups: groups, posts: posts };
  }
}
</script>
