@keyframes spDrop{0%{transform:translateY(-460px) rotate(0)}38%{transform:translateY(0) rotate(0)}50%{transform:translateY(0) rotate(7deg)}62%{transform:rotate(-5deg)}74%{transform:rotate(3deg)}85%{transform:rotate(-1.4deg)}93%{transform:rotate(.6deg)}100%{transform:rotate(0)}}

@keyframes spTilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}70%{transform:rotate(3deg)}}
@keyframes spFlag{0%{opacity:0;transform:scaleX(0)}20%{opacity:1}60%{transform:scaleX(1.12) skewY(-3deg)}100%{opacity:1;transform:none}}
@keyframes spUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes spLine{from{stroke-dashoffset:130}to{stroke-dashoffset:0}}
@keyframes spBall{0%{transform:translate(-140px,40px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(140px,-30px) rotate(540deg);opacity:0}}
@keyframes spBar{0%{transform:scaleX(0)}60%{transform:scaleX(.72)}100%{transform:scaleX(1)}}
.sp-sign{transform-origin:50% 0;animation:spDrop 1.5s cubic-bezier(.3,1,.5,1) .15s both}
.sp-peek{animation:spPeek .7s cubic-bezier(.3,1.3,.5,1) .55s both}
.sp-tilt{transform-origin:50% 100%;animation:spTilt 1.1s ease-in-out 1.3s both}
.sp-flag{transform-origin:79% 26%;animation:spFlag .5s cubic-bezier(.3,1.4,.5,1) 1.15s both}
.sp-tag{animation:spUp .45s ease-out 1.05s both}
.sp-line{stroke-dasharray:130;animation:spLine .5s ease-out 1.35s both}
.sp-ball{animation:spBall 1.4s ease-in-out .4s both}
.sp-bar{animation:spBar 1.8s cubic-bezier(.4,0,.2,1) .3s both}
@media (prefers-reduced-motion: reduce){.sp-sign,.sp-peek,.sp-tilt,.sp-flag,.sp-tag,.sp-line,.sp-ball,.sp-bar{animation:none}}
</style>
