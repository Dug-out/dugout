<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모집 글 쓰기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=Jua&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B2A5C;text-decoration:none}a:hover{color:#0F1A3D}
input::placeholder,textarea::placeholder{color:#7A829C}

</style>
</helmet>
<div style="width: 390px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans KR', sans-serif; color: #141B33; overflow: hidden">
<header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 12px 12px 8px; background: #FFFFFF; border-bottom: 1px solid #E3E6F0"><a href="Mate.dc.html" aria-label="닫기" style="width: 44px; height: 44px; color: #141B33; display: flex; align-items: center; justify-content: center; border-radius: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a><h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 700">모집 글 쓰기</h1></header>
<form style="display: flex; flex-direction: column; gap: 24px; padding: 20px 20px 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">대표 이미지 <span style="font-size: 12px; font-weight: 400; color: #5A6380">(선택)</span></span>
<div style="display: flex; align-items: center; gap: 14px">
<sc-if value="{{hasImg}}" hint-placeholder-val="{{false}}"><span style="position: relative; width: 88px; height: 88px; flex: none; border-radius: 16px; overflow: hidden; display: flex"><img src="assets/mate-photo-sample.png" alt="선택한 대표 이미지" width="88" height="88" style="display: block; width: 88px; height: 88px; object-fit: cover"><button type="button" aria-label="대표 이미지 삭제" onClick="{{removeImg}}" style="position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: none; border-radius: 50%; background: rgba(15,26,61,0.7); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-if>
<sc-if value="{{noImg}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{addImg}}" style="width: 88px; height: 88px; flex: none; border: 1.5px dashed #B4BBD0; border-radius: 16px; background: #F7F8FC; color: #5A6380; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>사진 추가</button></sc-if>
<span style="flex: 1; font-size: 13px; line-height: 1.5; color: #5A6380">{{imgHint}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="tt" style="font-size: 14px; font-weight: 700">제목</label><input id="tt" type="text" placeholder="예) 목요일 퇴근 직관 같이 가요!" style="height: 50px; box-sizing: border-box; border: 1px solid #D5DAE8; border-radius: 12px; padding: 0 14px; font-size: 15px; font-family: 'IBM Plex Sans KR', sans-serif; color: #141B33; background: #FFFFFF"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">경기 선택</span>
<button type="button" style="height: 56px; border: 1px solid #D5DAE8; border-radius: 12px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer; text-align: left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2A5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg><span style="flex: 1; font-size: 15px; color: #7A829C">같이 볼 경기를 골라 주세요</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7390" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">좌석</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{seats}}" as="o" hint-placeholder-count="4"><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="true" onClick="{{o.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #1B2A5C; background: #1B2A5C; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer">{{o.label}}</button></sc-if><sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="false" onClick="{{o.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DAE8; background: #FFFFFF; color: #2F3756; font-size: 14px; font-weight: 500; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer">{{o.label}}</button></sc-if></sc-for></div></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 14px; font-weight: 700">모집 인원&nbsp;&nbsp;<span style="font-size: 12px; font-weight: 400; color: rgb(90, 99, 128)">(본인 포함)</span></span>
<div style="display: flex; align-items: center; gap: 4px; border: 1px solid #D5DAE8; border-radius: 12px">
<button type="button" aria-label="인원 줄이기" onClick="{{dec}}" style="width: 44px; height: 44px; border: none; background: transparent; color: #1B2A5C; font-size: 20px; cursor: pointer; font-family: 'IBM Plex Sans KR', sans-serif">−</button>
<span style="width: 40px; text-align: center; font-size: 16px; font-weight: 700">{{count}}명</span>
<button type="button" aria-label="인원 늘리기" onClick="{{inc}}" style="width: 44px; height: 44px; border: none; background: transparent; color: #1B2A5C; font-size: 20px; cursor: pointer; font-family: 'IBM Plex Sans KR', sans-serif">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">나이대&nbsp;&nbsp;<span style="font-size: 12px; font-weight: 400; color: rgb(90, 99, 128)">(여러 개 선택 가능)</span></span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ages}}" as="o" hint-placeholder-count="4"><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="true" onClick="{{o.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #1B2A5C; background: #1B2A5C; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer">{{o.label}}</button></sc-if><sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="false" onClick="{{o.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DAE8; background: #FFFFFF; color: #2F3756; font-size: 14px; font-weight: 500; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer">{{o.label}}</button></sc-if></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">성별</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{genders}}" as="o" hint-placeholder-count="4"><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="true" onClick="{{o.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #1B2A5C; background: #1B2A5C; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer">{{o.label}}</button></sc-if><sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="false" onClick="{{o.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DAE8; background: #FFFFFF; color: #2F3756; font-size: 14px; font-weight: 500; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer">{{o.label}}</button></sc-if></sc-for></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="ds" style="font-size: 14px; font-weight: 700">소개</label><textarea id="ds" rows="5" placeholder="어떤 분과 직관하고 싶은지, 좌석은 어디인지 등 소개 글을 자세히 적어주세요." style="box-sizing: border-box; border: 1px solid #D5DAE8; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.6; font-family: 'IBM Plex Sans KR', sans-serif; color: #141B33; resize: none"></textarea></div>
</form>
<div style="padding: 28px 20px 28px"><a href="Mate-detail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #1B2A5C; color: #FFFFFF; font-size: 16px; font-weight: 700">모집 글 올리기</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1080}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const hasImg = !!st.hasImg;
    const count = st.count || 2;
    const one = (key, list) => list.map((v) => ({ label: v, on: st[key] === v, off: st[key] !== v, pick: () => this.setState({ [key]: st[key] === v ? '' : v }) }));
    const many = (key, list) => { const cur = st[key] || []; return list.map((v) => { const on = cur.indexOf(v) >= 0; return { label: v, on: on, off: !on, pick: () => this.setState({ [key]: on ? cur.filter((x) => x !== v) : cur.concat([v]) }) }; }); };
    return {
      hasImg: hasImg, noImg: !hasImg,
      addImg: () => this.setState({ hasImg: true }),
      removeImg: () => this.setState({ hasImg: false }),
      imgHint: hasImg ? '목록과 상세 위에 이 사진이 보여요.' : '사진을 올리면 모집 글이 더 눈에 띄어요.',
      seats: one('seat', ['응원석', '테이블석', '내야석', '외야석']),
      ages: many('ages', ['10대', '20대', '30대', '40대 이상']),
      genders: one('gender', ['여성', '남성', '무관']),
      count: count,
      dec: () => this.setState({ count: Math.max(2, count - 1) }),
      inc: () => this.setState({ count: Math.min(10, count + 1) })
    };
  }
}
</script>
</body>
</html>
